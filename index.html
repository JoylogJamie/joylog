<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex !important; }
    </style>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-start mb-8">
            <h1 class="text-3xl font-black italic">JoyLog</h1>
            <div class="flex gap-2">
                <button onclick="alert('가이드: + 버튼을 눌러 기록하세요.')" class="bg-gray-200 px-4 py-2 rounded-xl font-bold">GUIDE</button>
                <button onclick="document.getElementById('entryModal').classList.add('active')" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">+</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm mb-6">
            <canvas id="chart"></canvas>
        </div>
        
        <div id="logs" class="space-y-3"></div>
    </div>

    <div id="entryModal" class="modal">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm m-4">
            <h2 class="font-bold text-lg mb-4">새 기록</h2>
            <input type="text" id="act" placeholder="활동 내용" class="w-full p-3 bg-gray-100 rounded-xl mb-2">
            <input type="number" id="score" placeholder="점수(1-10)" class="w-full p-3 bg-gray-100 rounded-xl mb-4">
            <button onclick="saveLog()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">저장</button>
            <button onclick="document.getElementById('entryModal').classList.remove('active')" class="w-full mt-2 text-gray-400">취소</button>
        </div>
    </div>

    <script>
        function saveLog() {
            const act = document.getElementById('act').value;
            const score = document.getElementById('score').value;
            if(!act || !score) return alert('내용과 점수를 입력하세요.');
            
            let data = JSON.parse(localStorage.getItem('joylogs') || '[]');
            data.push({act, score, date: new Date().toLocaleDateString()});
            localStorage.setItem('joylogs', JSON.stringify(data));
            
            document.getElementById('entryModal').classList.remove('active');
            renderLogs();
        }

        function renderLogs() {
            const data = JSON.parse(localStorage.getItem('joylogs') || '[]');
            document.getElementById('logs').innerHTML = data.map(item => 
                `<div class="bg-white p-4 rounded-xl shadow-sm">${item.date} | ${item.act} (${item.score}점)</div>`
            ).join('');
        }
        
        renderLogs();
    </script>
</body>
</html>
