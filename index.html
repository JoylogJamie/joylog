<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FB] p-6">
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-3xl font-black italic">JoyLog</h1>
                <p class="text-xs text-gray-400 font-bold tracking-widest">DATED HISTORY</p>
            </div>
        </div>

        <div class="flex gap-3 mb-8">
            <button onclick="resetData()" class="flex-1 py-3 bg-[#FFF0ED] text-[#E06653] rounded-2xl font-bold">RESET</button>
            <button onclick="showGuide()" class="flex-1 py-3 bg-[#E9E9EB] text-[#555] rounded-2xl font-bold">GUIDE</button>
            <button onclick="addEntry()" class="w-16 py-3 bg-[#5D5FEF] text-white rounded-2xl font-bold text-2xl">+</button>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 mb-8">
            <div class="flex justify-between mb-4">
                <span class="font-bold">월간 밸런스</span>
                <span id="total" class="text-indigo-600 font-bold italic">Total 0</span>
            </div>
            <canvas id="balanceChart" height="200"></canvas>
        </div>

        <h2 class="font-bold mb-4">최근의 기록들</h2>
        <div id="logList" class="space-y-3"></div>
    </div>

    <script>
        // 1. 가이드 버튼 기능
        function showGuide() {
            alert("JoyLog 사용법: + 버튼을 눌러 활동을 기록하세요. 기록이 쌓이면 차트에 밸런스가 표시됩니다!");
        }

        // 2. 기록하기 버튼 기능
        function addEntry() {
            const cat = prompt("카테고리를 입력하세요 (PHY, EMO, SOC, INT, ACH)");
            if(cat) {
                const logs = JSON.parse(localStorage.getItem('joylogs') || '[]');
                logs.push({ date: new Date().toLocaleDateString(), cat: cat.toUpperCase() });
                localStorage.setItem('joylogs', JSON.stringify(logs));
                render();
            }
        }

        // 3. 초기화 버튼
        function resetData() {
            if(confirm("모든 기록을 삭제할까요?")) {
                localStorage.removeItem('joylogs');
                render();
            }
        }

        function render() {
            const logs = JSON.parse(localStorage.getItem('joylogs') || '[]');
            document.getElementById('logList').innerHTML = logs.map(l => `<div class="bg-white p-4 rounded-xl border">${l.date} | ${l.cat}</div>`).reverse().join('');
            document.getElementById('total').innerText = `Total ${logs.length}`;
        }
        
        render();
        new Chart(document.getElementById('balanceChart'), { type: 'bar', data: { labels: ['PHY','EMO','SOC','INT','ACH'], datasets: [{ data: [0,0,0,0,0], backgroundColor: '#5D5FEF' }] } });
    </script>
</body>
</html>
