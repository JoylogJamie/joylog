<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JoyLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-slate-50">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-lg">
        <h1 class="text-2xl font-black mb-4">JoyLog</h1>
        <div id="logs" class="mb-4 text-sm text-gray-600"></div>
        <button onclick="record()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">+ 기록하기</button>
    </div>
    <script>
        function record() {
            const entry = prompt("오늘의 활동과 점수를 입력하세요 (예: PHY-8)");
            if (entry) {
                const date = new Date().toLocaleDateString();
                const log = document.createElement('div');
                log.innerHTML = `<div>${date}: ${entry}</div>`;
                document.getElementById('logs').prepend(log);
            }
        }
    </script>
</body>
</html>
