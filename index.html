<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FB] p-6">
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-3xl font-black italic">JoyLog</h1>
                <p class="text-xs text-gray-400 font-bold tracking-widest">DATED HISTORY</p>
            </div>
            <div class="flex gap-2">
                <button class="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold">KO</button>
                <button class="px-3 py-1 bg-white border rounded-lg text-xs font-bold">EN</button>
            </div>
        </div>

        <div class="flex gap-3 mb-8">
            <button onclick="resetData()" class="flex-1 py-3 bg-[#FFF0ED] text-[#E06653] rounded-2xl font-bold">RESET</button>
            <button class="flex-1 py-3 bg-[#E9E9EB] text-[#555] rounded-2xl font-bold">GUIDE</button>
            <button onclick="addEntry()" class="w-16 py-3 bg-[#5D5FEF] text-white rounded-2xl font-bold text-2xl">+</button>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 mb-8">
            <div class="flex justify-between mb-4">
                <span class="font-bold">월간 밸런스</span>
                <span id="total" class="text-indigo-600 font-bold italic">Total 0</span>
            </div>
            <canvas id="balanceChart" height="200"></canvas>
        </div>

        <h2 class="font-bold mb-4">최근의 기록들</h2>
        <div id="logList" class="space-y-3"></div>
    </div>

    <script>
        let db;
        const request = indexedDB.open("JoyLogData", 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("logs", {autoIncrement: true});
        request.onsuccess = e => { db = e.target.result; render(); };

        function addEntry() {
            const cat = prompt("카테고리 선택: PHY, EMO, SOC, INT, ACH");
            if(cat) {
                db.transaction("logs", "readwrite").objectStore("logs").add({cat, date: new Date().toLocaleDateString()}).onsuccess = render;
            }
        }

        function render() {
            db.transaction("logs", "readonly").objectStore("logs").getAll().onsuccess = e => {
                const logs = e.target.result;
                document.getElementById('logList').innerHTML = logs.map(l => `<div class="bg-white p-4 rounded-xl border">${l.date} - ${l.cat}</div>`).join('');
                document.getElementById('total').innerText = `Total ${logs.length}`;
            };
        }
        function resetData() { if(confirm("초기화?")) { indexedDB.deleteDatabase("JoyLogData"); location.reload(); } }
        
        new Chart(document.getElementById('balanceChart'), { type: 'bar', data: { labels: ['PHY','EMO','SOC','INT','ACH'], datasets: [{ data: [1,2,3,4,5], backgroundColor: '#5D5FEF' }] } });
    </script>
</body>
</html>
